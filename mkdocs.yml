site_name: Splunk Lab Automation Suite
site_url: https://your-org.github.io/splunk-lab-automation-suite
repo_url: https://github.com/your-org/splunk-lab-automation-suite
repo_name: splunk-lab-automation-suite

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.share

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Modules:
      - Deployment & Configs: modules/deployment.md
      - Monitoring & Health: modules/monitoring.md
      - Forwarders: modules/forwarders.md
      - Users & Roles: modules/users_roles.md
      - Knowledge Objects: modules/kos.md
      - CI/CD & DevOps: modules/cicd.md
  - Developer Guide: contributing.md
  - Project Roadmap: roadmap.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - codehilite
  - footnotes
  - pymdownx.superfences
  - pymdownx.details
